name: Feature request
description: Suggest a page, option or behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: What are you trying to do on Amazon that is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
