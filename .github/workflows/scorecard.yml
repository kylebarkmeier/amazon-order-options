name: OpenSSF Scorecard

# Scores the repository's own security practices (branch protection, pinned
# dependencies, token permissions, dangerous workflow patterns, ...) and
# uploads the results to the Security tab. Runs weekly and on pushes to main.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 7 * * 2'
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
