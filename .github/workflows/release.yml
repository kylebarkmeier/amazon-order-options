name: Release

# Pushing a tag such as v1.2.3 builds everything, runs the checks, and
# publishes a GitHub release with:
#   amazon-order-options-chrome-<version>.zip    unpacked-extension zip for Chromium browsers
#   amazon-order-options-firefox-<version>.zip   Firefox source zip (for AMO upload or temporary load)
#   amazon-order-options-firefox-<version>.xpi   signed Firefox add-on, only when AMO secrets are set
#   amazon-order-options.user.js                 Tampermonkey / Violentmonkey / Greasemonkey script
#   *.sha256                                     checksums for every asset above
#
# Every asset also gets a signed build provenance attestation (SLSA), which
# anyone can verify with `gh attestation verify <file> --owner <owner>`.
#
# The job runs in the "release" environment. If that environment has required
# reviewers (see docs/github-security.md), the publish waits for approval.
#
# The userscript's @updateURL points at the "latest" alias of its asset, so
# userscript managers update themselves after every release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    name: Build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
      # The secrets context is not allowed in a step-level `if`, so the check happens here.
      HAS_AMO: ${{ secrets.WEB_EXT_API_KEY != '' && secrets.WEB_EXT_API_SECRET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$VERSION" ]; then
            echo "::error::Tag $VERSION does not match package.json version v$version. Bump package.json first."
            exit 1
          fi

      - run: npm run lint
      - run: npm run test:unit
      - run: npm run package
      - run: npm run lint:webext

      - name: Sign the Firefox add-on through AMO (only when secrets are configured)
        id: sign
        if: env.HAS_AMO == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          # web-ext is fetched here on demand rather than kept as a dev dependency:
          # its Android tooling drags in packages with open advisories.
          npx --yes web-ext@10.8.0 sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --channel unlisted \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"
          xpi=$(ls dist/signed/*.xpi | head -n 1)
          cp "$xpi" "dist/amazon-order-options-firefox-${VERSION#v}.xpi"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Collect release assets and write checksums
        id: assets
        run: |
          mkdir -p release
          cp "dist/amazon-order-options-chrome-${VERSION#v}.zip" release/
          cp "dist/amazon-order-options-firefox-${VERSION#v}.zip" release/
          cp dist/amazon-order-options.user.js release/
          if [ -f "dist/amazon-order-options-firefox-${VERSION#v}.xpi" ]; then
            cp "dist/amazon-order-options-firefox-${VERSION#v}.xpi" release/
          fi
          (cd release && for f in *; do sha256sum "$f" > "$f.sha256"; done)
          ls -l release

      - name: Attest build provenance for the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.xpi
            release/*.user.js

      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          version="${VERSION#v}"
          base="https://github.com/$REPO/releases/download/$VERSION"
          {
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "## Install"
            echo
            echo "**Chrome, Edge, Brave, Kiwi and other Chromium browsers**"
            echo "1. Download [amazon-order-options-chrome-$version.zip]($base/amazon-order-options-chrome-$version.zip) and unzip it."
            echo "2. Open \`chrome://extensions\`, turn on Developer mode, choose **Load unpacked**, pick the folder."
            echo
            echo "**Firefox (desktop and Android)**"
            if [ "$SIGNED" = "true" ]; then
              echo "- Download [amazon-order-options-firefox-$version.xpi]($base/amazon-order-options-firefox-$version.xpi). Desktop: open the file in Firefox and approve the install. Android: enable the debug menu (Settings, About Firefox, tap the logo five times), then Settings, Install extension from file."
            else
              echo "- Download [amazon-order-options-firefox-$version.zip]($base/amazon-order-options-firefox-$version.zip). Desktop: \`about:debugging#/runtime/this-firefox\`, **Load Temporary Add-on**, pick the zip. For a permanent install the zip must be signed by AMO; see the README."
            fi
            echo
            echo "**Tampermonkey, Violentmonkey, Greasemonkey**"
            echo "- Open [amazon-order-options.user.js]($base/amazon-order-options.user.js) and confirm the install. Updates arrive automatically."
            echo
            echo "## Verify"
            echo
            echo "Each asset has a \`.sha256\` file and a signed build provenance attestation:"
            echo
            echo '```'
            echo "sha256sum -c amazon-order-options-chrome-$version.zip.sha256"
            echo "gh attestation verify amazon-order-options-chrome-$version.zip --owner ${REPO%%/*}"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag \
            release/*
